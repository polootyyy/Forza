name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract project archive
        shell: pwsh
        run: |
          $srcZip = Join-Path $env:GITHUB_WORKSPACE "Polootyyy_FH6_Trainer.zip"
          $dest = Join-Path $env:RUNNER_TEMP "src"
          Expand-Archive -Path $srcZip -DestinationPath $dest -Force
          "PROJECT_DIR=$dest/FH6Trainer" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Patch package reference in CI copy
        shell: pwsh
        run: |
          $proj = "$env:PROJECT_DIR/FH6Trainer.csproj"
          [xml]$xml = Get-Content $proj

          $found = $false
          foreach ($itemGroup in $xml.Project.ItemGroup) {
            foreach ($pkg in $itemGroup.PackageReference) {
              if ($pkg.Include -eq "Microsoft.Web.WebView2.Core.Projection") {
                $pkg.Include = "Microsoft.Web.WebView2"
                $found = $true
              }
            }
          }

          if (-not $found) {
            Write-Host "No Microsoft.Web.WebView2.Core.Projection reference found; continuing."
          }

          $xml.Save($proj)

          # HotkeyService uses WPF key types not available in MAUI WinUI builds.
          # Patch CI copy to use raw virtual key codes while preserving behavior.
          $hotkeyFile = "$env:PROJECT_DIR/Services/HotkeyService.cs"
          $hotkeyContent = Get-Content $hotkeyFile -Raw
          $hotkeyContent = [regex]::Replace(
            $hotkeyContent,
            "public int Register\(string name,\s*System\.Windows\.Input\.Key key,\s*(?:System\.Windows\.Input\.)?ModifierKeys mods,\s*Action action\)",
            "public int Register(string name, uint key, ModifierKeys mods, Action action)"
          )
          $hotkeyContent = $hotkeyContent.Replace(
            "uint vk = (uint)KeyInterop.VirtualKeyFromKey(key);",
            "uint vk = key;"
          )

          if (-not ($hotkeyContent.Contains("public enum ModifierKeys"))) {
            $insert = "[Flags]`npublic enum ModifierKeys : uint`n{`n    Alt = MOD_ALT,`n    Control = MOD_CONTROL,`n    Shift = MOD_SHIFT`n}`n`n"
            $hotkeyContent = $hotkeyContent.Replace(
              "private readonly Dictionary<int, (string Name, Action Action)> _hotkeys = new();",
              $insert + "private readonly Dictionary<int, (string Name, Action Action)> _hotkeys = new();"
            )
          }

          if ($hotkeyContent.Contains("public int Register(string name, System.Windows.Input.Key key")) {
            throw "Failed to patch HotkeyService signature for MAUI WinUI build."
          }
          if (-not [regex]::IsMatch($hotkeyContent, "public int Register\(string name,\s*uint key,\s*ModifierKeys mods,\s*Action action\)")) {
            throw "Failed to verify patched HotkeyService signature for MAUI WinUI build."
          }

          Set-Content -Path $hotkeyFile -Value $hotkeyContent -NoNewline

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Restore
        run: dotnet restore "$env:PROJECT_DIR/FH6Trainer.csproj" -p:TargetFramework=net10.0-windows10.0.19041.0 -p:SkipValidateMauiImplicitPackageReferences=true

      - name: Publish unpackaged Windows app folder
        run: dotnet publish "$env:PROJECT_DIR/FH6Trainer.csproj" -f net10.0-windows10.0.19041.0 -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -p:PublishSingleFile=false -p:SkipValidateMauiImplicitPackageReferences=true -o "$env:RUNNER_TEMP/publish"

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polootyyy-win-x64
          path: |
            ${{ runner.temp }}/publish/**

      - name: Zip publish folder
        shell: pwsh
        run: |
          $zipOut = Join-Path $env:RUNNER_TEMP "Polootyyy-win-x64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/publish/*" -DestinationPath $zipOut -Force
          "RELEASE_ZIP=$zipOut" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-build-${{ github.run_number }}
          name: Windows Build ${{ github.run_number }}
          files: ${{ env.RELEASE_ZIP }}
